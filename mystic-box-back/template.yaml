Outputs:
  OpenBoxApi:
    Description: API Gateway endpoint URL for the open box function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/box/open"
  GetUserCardsApi:
    Description: API Gateway endpoint URL for the user cards function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/cards"
  SaveUserCardApi:
    Description: API Gateway endpoint URL for the save user card function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/cards"
  UserPoolId:
    Description: Cognito User Pool ID used by the web client
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID used by the web client
    Value: !Ref UserPoolClient
  OpenBoxFunction:
    Description: Open Box Lambda Function ARN
    Value: !GetAtt OpenBoxFunction.Arn
  GetUserCardsFunction:
    Description: Get User Cards Lambda Function ARN
    Value: !GetAtt GetUserCardsFunction.Arn
  SaveUserCardFunction:
    Description: Save User Card Lambda Function ARN
    Value: !GetAtt SaveUserCardFunction.Arn
  CardsTable:
    Description: DynamoDB table that stores the cards
    Value: !Ref CardsTable
  GetSummonStatusApi:
    Description: API Gateway endpoint URL for the summon cooldown status function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/summon-status"
  UserCardsTable:
    Description: DynamoDB table that stores the cards owned by each user
    Value: !Ref UserCardsTable
  AscendCardApi:
    Description: API Gateway endpoint URL to consume duplicate copies and ascend a card
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/cards/ascend"
  CardAscensionsTable:
    Description: DynamoDB table that stores each player's card ascension levels
    Value: !Ref CardAscensionsTable
  GetWalletApi:
    Description: API Gateway endpoint URL for the user's wallet (Fragmentos Arcanos)
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/wallet"
  UserWalletTable:
    Description: DynamoDB table that stores each user's Fragmentos Arcanos balance and active listing count
    Value: !Ref UserWalletTable
  ShopListingsApi:
    Description: API Gateway endpoint URL to browse (GET) and create (POST) shop listings
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/shop/listings"
  BuyListingApi:
    Description: API Gateway endpoint URL to buy a card listed by another player
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/shop/listings/{listingId}/buy"
  CancelListingApi:
    Description: API Gateway endpoint URL to cancel one of your listings
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/shop/listings/{listingId}/cancel"
  ShopListingsTable:
    Description: DynamoDB table that stores the cards players put up for sale
    Value: !Ref ShopListingsTable
  GetProfileApi:
    Description: API Gateway endpoint URL for the player's level and experience
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/profile"
  UserProgressTable:
    Description: DynamoDB table that stores each player's experience, wins and losses
    Value: !Ref UserProgressTable
  SetUsernameApi:
    Description: API Gateway endpoint URL to set or change the player's username
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/username"
  SearchUsersApi:
    Description: API Gateway endpoint URL to search players by username
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/search"
  UserProfilesTable:
    Description: DynamoDB table that stores each player's username
    Value: !Ref UserProfilesTable
  StartBattleApi:
    Description: API Gateway endpoint URL to start a battle against the computer
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/battles"
  BattleActionApi:
    Description: API Gateway endpoint URL to play a turn in the current battle
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/battles/current/actions"
  GetBattleApi:
    Description: API Gateway endpoint URL for the current battle and battle options
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/battles/current"
  BattlesTable:
    Description: DynamoDB table that stores each player's current battle
    Value: !Ref BattlesTable
  PvpLobbyApi:
    Description: API Gateway endpoint URL for online duel challenges and the current duel
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/pvp"
  PvpBattleApi:
    Description: API Gateway endpoint URL for the current online duel
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/pvp/battle"
  PvpBattlesTable:
    Description: DynamoDB table that stores online duels
    Value: !Ref PvpBattlesTable
