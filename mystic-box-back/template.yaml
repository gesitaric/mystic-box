AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  mystic-box-back

  Sample SAM Template for mystic-box-back

Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        SUMMON_COOLDOWN_SECONDS: "3600"

    # X-Ray desligado: quase não é usado e cobra por rastro (o duelo online
    # faz muitas consultas). Para investigar algo, volte para Active.
    Tracing: PassThrough
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: false
Resources:
  MysticBoxApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      # Limite de requisições da busca de jogadores, somando todos os jogadores
      # (token bucket do API Gateway: média por segundo e pico). Acima disso o
      # API Gateway responde 429 sem chamar a Lambda.
      MethodSettings:
      - ResourcePath: "/~1users~1search"
        HttpMethod: GET
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      # Sem os cabeçalhos CORS o navegador não deixa o frontend ler o 429.
      GatewayResponses:
        THROTTLED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"message": "Too many requests. Please wait a moment and try again."}'

  CardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: cardId
        AttributeType: S
      KeySchema:
      - AttributeName: cardId
        KeyType: HASH

  UserCardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: ownedCardId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: ownedCardId
        KeyType: RANGE

  UserSummonStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  UserWalletTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  # Mercado entre jogadores: cada item é uma cópia anunciada por um jogador,
  # com o preço que ele escolheu. Enquanto está aqui, a carta não está na
  # coleção do vendedor. Vendidos e cancelados saem da tabela.
  ShopListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: listingId
        AttributeType: S
      KeySchema:
      - AttributeName: listingId
        KeyType: HASH

  # Experiência acumulada (o nível é calculado dela), vitórias e derrotas.
  UserProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  # Ascensão de cada carta de cada jogador (cópias repetidas consumidas para
  # fortalecer a carta). Fica com o jogador, não com uma cópia.
  CardAscensionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: file_name
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: file_name
        KeyType: RANGE

  # Nome de cada jogador e quando ele foi trocado pela última vez. Quem tem
  # nome também tem searchKey, que o coloca no índice de busca por nome.
  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: searchKey
        AttributeType: S
      - AttributeName: usernameLower
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: UsernameSearchIndex
        KeySchema:
        - AttributeName: searchKey
          KeyType: HASH
        - AttributeName: usernameLower
          KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
          - username

  # Reserva de nomes (em minúsculas): garante que cada nome tem um só dono.
  UsernamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: usernameLower
        AttributeType: S
      KeySchema:
      - AttributeName: usernameLower
        KeyType: HASH

  # Batalha de cada jogador contra o computador (uma por vez). O estado fica
  # em JSON e some sozinho pelo TTL um dia depois da última ação.
  BattlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Desafios do duelo online: um por par (quem foi desafiado, quem desafiou).
  # Expiram sozinhos (TTL); o código também ignora os vencidos.
  PvpChallengesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: opponentId
        AttributeType: S
      - AttributeName: challengerId
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: N
      KeySchema:
      - AttributeName: opponentId
        KeyType: HASH
      - AttributeName: challengerId
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: ChallengerIndex
        KeySchema:
        - AttributeName: challengerId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Duelos online (estado em JSON, com versão). Somem pelo TTL um dia depois
  # da última ação.
  PvpBattlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: battleId
        AttributeType: S
      KeySchema:
      - AttributeName: battleId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Duelo de cada jogador (status active/finished): garante um duelo ativo
  # por jogador e aponta para o último duelo.
  PvpPlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Progresso de cada jogador nas regiões: fases da campanha vencidas
  # (`stage_<região>`).
  RegionProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  # Tokens de sorteio já usados para guardar cartas (uso único). Os itens
  # somem sozinhos pelo TTL depois que o token expira.
  SummonTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: tokenId
        AttributeType: S
      KeySchema:
      - AttributeName: tokenId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Chave HMAC que assina os sorteios do open_box (ver shared/mystic_shared/summon_token.py).
  SummonTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Chave que assina os sorteios do Mystic Box
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # Código compartilhado entre as Lambdas: definições das cartas (com preço),
  # regras do sorteio e token de sorteio. Fonte única das regras do jogo.
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: mystic-box-shared
      Description: Regras e definicoes compartilhadas do Mystic Box
      ContentUri: shared/
      CompatibleRuntimes:
      - python3.14
    Metadata:
      BuildMethod: python3.14

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: mystic-box-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      AccountRecoverySetting:
        RecoveryMechanisms:
        - Name: verified_email
          Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: mystic-box-web
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  OpenBoxFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: open_box/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          SUMMON_TOKEN_SECRET_ARN: !Ref SummonTokenSecret
      Policies:
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref SummonTokenSecret
      Events:
        OpenBox:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /box/open
            Method: post
        OpenBoxOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /box/open
            Method: options

  GetUserCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_user_cards/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
          CARD_ASCENSIONS_TABLE: !Ref CardAscensionsTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBReadPolicy:
          TableName: !Ref CardAscensionsTable
      Events:
        GetUserCards:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetUserCardsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards
            Method: options

  AscendCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ascend_card/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
          CARD_ASCENSIONS_TABLE: !Ref CardAscensionsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref CardAscensionsTable
      Events:
        AscendCard:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards/ascend
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        AscendCardOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards/ascend
            Method: options

  SaveUserCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: save_user_card/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_SUMMON_STATE_TABLE: !Ref UserSummonStateTable
          SUMMON_TOKENS_TABLE: !Ref SummonTokensTable
          SUMMON_TOKEN_SECRET_ARN: !Ref SummonTokenSecret
      Policies:
      - DynamoDBWritePolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserSummonStateTable
      - DynamoDBWritePolicy:
          TableName: !Ref SummonTokensTable
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref SummonTokenSecret
      Events:
        SaveUserCard:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  GetSummonStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_summon_status/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          USER_SUMMON_STATE_TABLE: !Ref UserSummonStateTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserSummonStateTable
      Events:
        GetSummonStatus:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/summon-status
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetSummonStatusOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/summon-status
            Method: options

  GetWalletFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_wallet/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserWalletTable
      Events:
        GetWallet:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/wallet
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetWalletOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/wallet
            Method: options

  GetShopListingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: shop_listings/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          SHOP_LISTINGS_TABLE: !Ref ShopListingsTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref ShopListingsTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserWalletTable
      Events:
        GetShopListings:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetShopListingsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings
            Method: options

  CreateListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create_listing/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          SHOP_LISTINGS_TABLE: !Ref ShopListingsTable
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref ShopListingsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        CreateListing:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  BuyListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: buy_listing/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          SHOP_LISTINGS_TABLE: !Ref ShopListingsTable
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref ShopListingsTable
      - DynamoDBWritePolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        BuyListing:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings/{listingId}/buy
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        BuyListingOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings/{listingId}/buy
            Method: options

  CancelListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cancel_listing/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          SHOP_LISTINGS_TABLE: !Ref ShopListingsTable
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref ShopListingsTable
      - DynamoDBWritePolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        CancelListing:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings/{listingId}/cancel
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        CancelListingOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/listings/{listingId}/cancel
            Method: options

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_profile/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_PROGRESS_TABLE: !Ref UserProgressTable
          USER_PROFILES_TABLE: !Ref UserProfilesTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProfilesTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/profile
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetProfileOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/profile
            Method: options

  SetUsernameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: set_username/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_PROFILES_TABLE: !Ref UserProfilesTable
          USERNAMES_TABLE: !Ref UsernamesTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref UserProfilesTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UsernamesTable
      Events:
        SetUsername:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/username
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        SetUsernameOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/username
            Method: options

  SearchUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: search_users/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_PROFILES_TABLE: !Ref UserProfilesTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserProfilesTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      Events:
        SearchUsers:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/search
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        SearchUsersOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/search
            Method: options

  PlayBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: play_battle/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTable
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
          USER_WALLET_TABLE: !Ref UserWalletTable
          CARD_ASCENSIONS_TABLE: !Ref CardAscensionsTable
          REGION_PROGRESS_TABLE: !Ref RegionProgressTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref RegionProgressTable
      - DynamoDBCrudPolicy:
          TableName: !Ref BattlesTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBReadPolicy:
          TableName: !Ref CardAscensionsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserProgressTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        StartBattle:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        StartBattleOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles
            Method: options
        BattleAction:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current/actions
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        BattleActionOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current/actions
            Method: options

  GetCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_campaign/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          REGION_PROGRESS_TABLE: !Ref RegionProgressTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref RegionProgressTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      Events:
        GetCampaign:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/campaign
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetCampaignOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/campaign
            Method: options

  GetBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_battle/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
          PVP_PLAYERS_TABLE: !Ref PvpPlayersTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref BattlesTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      - DynamoDBReadPolicy:
          TableName: !Ref PvpPlayersTable
      Events:
        GetBattle:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current
            Method: get
            Auth:
