AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  mystic-box-back

  Sample SAM Template for mystic-box-back

Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        SUMMON_COOLDOWN_SECONDS: "3600"

    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  MysticBoxApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  CardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: cardId
        AttributeType: S
      KeySchema:
      - AttributeName: cardId
        KeyType: HASH

  UserCardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: ownedCardId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: ownedCardId
        KeyType: RANGE

  UserSummonStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  UserWalletTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  # Experiência acumulada (o nível é calculado dela), vitórias e derrotas.
  UserProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH

  # Nome de cada jogador e quando ele foi trocado pela última vez. Quem tem
  # nome também tem searchKey, que o coloca no índice de busca por nome.
  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: searchKey
        AttributeType: S
      - AttributeName: usernameLower
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: UsernameSearchIndex
        KeySchema:
        - AttributeName: searchKey
          KeyType: HASH
        - AttributeName: usernameLower
          KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
          - username

  # Reserva de nomes (em minúsculas): garante que cada nome tem um só dono.
  UsernamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: usernameLower
        AttributeType: S
      KeySchema:
      - AttributeName: usernameLower
        KeyType: HASH

  # Batalha de cada jogador contra o computador (uma por vez). O estado fica
  # em JSON e some sozinho pelo TTL um dia depois da última ação.
  BattlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Tokens de sorteio já usados para guardar cartas (uso único). Os itens
  # somem sozinhos pelo TTL depois que o token expira.
  SummonTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: tokenId
        AttributeType: S
      KeySchema:
      - AttributeName: tokenId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Chave HMAC que assina os sorteios do open_box (ver shared/mystic_shared/summon_token.py).
  SummonTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Chave que assina os sorteios do Mystic Box
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # Código compartilhado entre as Lambdas: definições das cartas (com preço),
  # regras do sorteio e token de sorteio. Fonte única das regras do jogo.
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: mystic-box-shared
      Description: Regras e definicoes compartilhadas do Mystic Box
      ContentUri: shared/
      CompatibleRuntimes:
      - python3.14
    Metadata:
      BuildMethod: python3.14

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: mystic-box-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      AccountRecoverySetting:
        RecoveryMechanisms:
        - Name: verified_email
          Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: mystic-box-web
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  OpenBoxFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: open_box/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          SUMMON_TOKEN_SECRET_ARN: !Ref SummonTokenSecret
      Policies:
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref SummonTokenSecret
      Events:
        OpenBox:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /box/open
            Method: post
        OpenBoxOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /box/open
            Method: options

  GetUserCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_user_cards/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserCardsTable
      Events:
        GetUserCards:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetUserCardsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards
            Method: options

  SaveUserCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: save_user_card/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_SUMMON_STATE_TABLE: !Ref UserSummonStateTable
          SUMMON_TOKENS_TABLE: !Ref SummonTokensTable
          SUMMON_TOKEN_SECRET_ARN: !Ref SummonTokenSecret
      Policies:
      - DynamoDBWritePolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserSummonStateTable
      - DynamoDBWritePolicy:
          TableName: !Ref SummonTokensTable
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref SummonTokenSecret
      Events:
        SaveUserCard:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  GetSummonStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_summon_status/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          USER_SUMMON_STATE_TABLE: !Ref UserSummonStateTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserSummonStateTable
      Events:
        GetSummonStatus:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/summon-status
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetSummonStatusOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/summon-status
            Method: options

  GetWalletFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_wallet/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserWalletTable
      Events:
        GetWallet:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/wallet
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetWalletOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/wallet
            Method: options

  SellUserCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sell_user_card/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        SellUserCard:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards/sell
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        SellUserCardOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/cards/sell
            Method: options

  GetShopCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_shop_cards/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserWalletTable
      Events:
        GetShopCards:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/cards
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetShopCardsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/cards
            Method: options

  BuyCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: buy_card/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBWritePolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        BuyCard:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/cards/{fileName}/buy
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        BuyCardOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /shop/cards/{fileName}/buy
            Method: options

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_profile/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_PROGRESS_TABLE: !Ref UserProgressTable
          USER_PROFILES_TABLE: !Ref UserProfilesTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProfilesTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/profile
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetProfileOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/profile
            Method: options

  SetUsernameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: set_username/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_PROFILES_TABLE: !Ref UserProfilesTable
          USERNAMES_TABLE: !Ref UsernamesTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref UserProfilesTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UsernamesTable
      Events:
        SetUsername:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/username
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        SetUsernameOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/me/username
            Method: options

  SearchUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: search_users/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          USER_PROFILES_TABLE: !Ref UserProfilesTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref UserProfilesTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      Events:
        SearchUsers:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/search
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        SearchUsersOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /users/search
            Method: options

  PlayBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: play_battle/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTable
          USER_CARDS_TABLE: !Ref UserCardsTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
          USER_WALLET_TABLE: !Ref UserWalletTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref BattlesTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserCardsTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserProgressTable
      - DynamoDBCrudPolicy:
          TableName: !Ref UserWalletTable
      Events:
        StartBattle:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        StartBattleOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles
            Method: options
        BattleAction:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current/actions
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        BattleActionOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current/actions
            Method: options

  GetBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_battle/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTable
          USER_PROGRESS_TABLE: !Ref UserProgressTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref BattlesTable
      - DynamoDBReadPolicy:
          TableName: !Ref UserProgressTable
      Events:
        GetBattle:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetBattleOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /battles/current
            Method: options

  GetRulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_rules/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Layers:
      - !Ref SharedLayer
      Events:
        GetRules:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /rules
            Method: get
        GetRulesOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MysticBoxApi
            Path: /rules
            Method: options

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
Outputs:
  OpenBoxApi:
    Description: API Gateway endpoint URL for the open box function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/box/open"
  GetUserCardsApi:
    Description: API Gateway endpoint URL for the user cards function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/cards"
  SaveUserCardApi:
    Description: API Gateway endpoint URL for the save user card function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/cards"
  UserPoolId:
    Description: Cognito User Pool ID used by the web client
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID used by the web client
    Value: !Ref UserPoolClient
  OpenBoxFunction:
    Description: Open Box Lambda Function ARN
    Value: !GetAtt OpenBoxFunction.Arn
  GetUserCardsFunction:
    Description: Get User Cards Lambda Function ARN
    Value: !GetAtt GetUserCardsFunction.Arn
  SaveUserCardFunction:
    Description: Save User Card Lambda Function ARN
    Value: !GetAtt SaveUserCardFunction.Arn
  CardsTable:
    Description: DynamoDB table that stores the cards
    Value: !Ref CardsTable
  GetSummonStatusApi:
    Description: API Gateway endpoint URL for the summon cooldown status function
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/summon-status"
  UserCardsTable:
    Description: DynamoDB table that stores the cards owned by each user
    Value: !Ref UserCardsTable
  GetWalletApi:
    Description: API Gateway endpoint URL for the user's wallet (Fragmentos Arcanos)
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/wallet"
  UserWalletTable:
    Description: DynamoDB table that stores each user's Fragmentos Arcanos balance
    Value: !Ref UserWalletTable
  SellUserCardApi:
    Description: API Gateway endpoint URL to sell one or more copies of a card from the user collection
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/cards/sell"
  SellUserCardFunction:
    Description: Sell User Card Lambda Function ARN
    Value: !GetAtt SellUserCardFunction.Arn
  GetShopCardsApi:
    Description: API Gateway endpoint URL for the shop catalog
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/shop/cards"
  BuyCardApi:
    Description: API Gateway endpoint URL to buy a card in the shop
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/shop/cards/{fileName}/buy"
  BuyCardFunction:
    Description: Buy Card Lambda Function ARN
    Value: !GetAtt BuyCardFunction.Arn
  GetProfileApi:
    Description: API Gateway endpoint URL for the player's level and experience
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/profile"
  UserProgressTable:
    Description: DynamoDB table that stores each player's experience, wins and losses
    Value: !Ref UserProgressTable
  SetUsernameApi:
    Description: API Gateway endpoint URL to set or change the player's username
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/me/username"
  SearchUsersApi:
    Description: API Gateway endpoint URL to search players by username
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/search"
  UserProfilesTable:
    Description: DynamoDB table that stores each player's username
    Value: !Ref UserProfilesTable
  StartBattleApi:
    Description: API Gateway endpoint URL to start a battle against the computer
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/battles"
  BattleActionApi:
    Description: API Gateway endpoint URL to play a turn in the current battle
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/battles/current/actions"
  GetBattleApi:
    Description: API Gateway endpoint URL for the current battle and battle options
    Value: !Sub "https://${MysticBoxApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/battles/current"
  BattlesTable:
    Description: DynamoDB table that stores each player's current battle
    Value: !Ref BattlesTable
