AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  mystic-box-back

  Sample SAM Template for mystic-box-back

Globals:
  Function:
    Timeout: 3

    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  CardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: cardId
        AttributeType: S
      KeySchema:
      - AttributeName: cardId
        KeyType: HASH

  OpenBoxFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: open_box/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          CARDS_TABLE: !Ref CardsTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref CardsTable
      Events:
        OpenBox:
          Type: Api
          Properties:
            Path: /box/open
            Method: post

  GetUserCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_user_cards/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          CARDS_TABLE: !Ref CardsTable
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref CardsTable
      Events:
        GetUserCards:
          Type: Api
          Properties:
            Path: /users/{userId}/cards
            Method: get

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
Outputs:
  OpenBoxApi:
    Description: API Gateway endpoint URL for the open box function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/box/open"
  GetUserCardsApi:
    Description: API Gateway endpoint URL for the user cards function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/users/{userId}/cards"
  OpenBoxFunction:
    Description: Open Box Lambda Function ARN
    Value: !GetAtt OpenBoxFunction.Arn
  GetUserCardsFunction:
    Description: Get User Cards Lambda Function ARN
    Value: !GetAtt GetUserCardsFunction.Arn
  CardsTable:
    Description: DynamoDB table that stores the cards
    Value: !Ref CardsTable
