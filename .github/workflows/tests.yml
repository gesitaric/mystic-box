name: Testes

on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystic-box-back
    env:
      # boto3 cria clientes ao importar alguns handlers; nenhum teste chama a AWS.
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: mystic-box-back/tests/requirements.txt

      - name: Instalar dependências
        run: pip install -r tests/requirements.txt

      - name: Rodar testes
        run: python -m pytest tests/unit

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystic-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mystic-box/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npx vite build

  layout:
    name: Frontend (testes de tela)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mystic-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mystic-box/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # A imagem do runner já costuma trazer o Edge; só instala se faltar.
      - name: Edge
        run: command -v microsoft-edge-stable || npx playwright install --with-deps msedge

      # Layout e comparação de imagem (referências -linux). Depois de uma
      # mudança visual proposital, ponha o rótulo "atualizar-imagens" no PR
      # (workflow screenshots.yml).
      - name: Testes de tela
        run: npx playwright test

      - name: Guardar relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            mystic-box/playwright-report
            mystic-box/test-results
          retention-days: 7

  welcome:
    name: Landing page (eslint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystic-box-welcome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mystic-box-welcome/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Testes
        run: npm test

      - name: Build
        run: npx vite build
