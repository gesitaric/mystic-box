name: Testes

on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystic-box-back
    env:
      # boto3 cria clientes ao importar alguns handlers; nenhum teste chama a AWS.
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: mystic-box-back/tests/requirements.txt

      - name: Instalar dependências
        run: pip install -r tests/requirements.txt

      - name: Rodar testes
        run: python -m pytest tests/unit

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystic-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mystic-box/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npx vite build
