<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1550"/>
      <stop offset="1" stop-color="#0e0820"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="30" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9c8ff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#b061ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7a2cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b3fe0"/>
      <stop offset="1" stop-color="#3d1a86"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9257f2"/>
      <stop offset="1" stop-color="#5a28b8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#e0a83a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="30" r="22" fill="url(#glow)"/>

  <!-- estrela que sai da caixa -->
  <path d="M32 6 L35 18 L47 21 L35 24 L32 36 L29 24 L17 21 L29 18 Z" fill="url(#gold)"/>
  <path d="M50 10 L51 13 L54 14 L51 15 L50 18 L49 15 L46 14 L49 13 Z" fill="#ffe7a3"/>
  <path d="M14 26 L15 28 L17 29 L15 30 L14 32 L13 30 L11 29 L13 28 Z" fill="#e9c8ff"/>

  <!-- tampa entreaberta -->
