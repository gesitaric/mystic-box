  <!-- corpo da caixa -->
  <rect x="13" y="39" width="38" height="18" rx="2" fill="url(#box)" stroke="url(#gold)" stroke-width="1.6"/>
  <rect x="29" y="39" width="6" height="18" fill="url(#gold)"/>
