# Configuracao do `sam deploy` da infra da landing page (rodar nesta pasta).
version = 0.1

[default.global.parameters]
stack_name = "mystic-box-welcome"
region = "us-east-1"

[default.validate.parameters]
lint = true

[default.deploy.parameters]
confirm_changeset = true
fail_on_empty_changeset = false
