AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mystic-box-welcome: landing page do Mystic Box (bucket S3 + CloudFront +
  registros no Route 53). O bucket nao e publico: so o CloudFront le os
  arquivos (Origin Access Control).

# Deploy: `sam deploy` nesta pasta (configuracao em samconfig.toml).
# Mesmo desenho da stack do jogo (mystic-box/infra/template.yaml).

Parameters:
  DomainName:
    Type: String
    Default: mystic-box-welcome.geskee.com.br
    Description: Dominio publico da landing page.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z07631273VVNV2AWGLCG1
    Description: Hosted zone do geskee.com.br no Route 53 (fora desta stack).
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:465926092387:certificate/ec238d23-530a-478b-87a3-7953140c2b21
    Description: Certificado ACM (us-east-1, exigido pelo CloudFront) que cobre o DomainName (*.geskee.com.br).

Resources:
  WelcomeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "mystic-box-welcome-${AWS::AccountId}"
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WelcomeOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Acesso do CloudFront ao bucket da landing page
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WelcomeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Mystic Box landing page
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
        - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
        - Id: WelcomeBucket
          DomainName: !GetAtt WelcomeBucket.RegionalDomainName
          OriginAccessControlId: !GetAtt WelcomeOriginAccessControl.Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: WelcomeBucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: respeita o Cache-Control gravado pelo deploy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy (HSTS, nosniff, frame-options etc.).
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # Pagina unica: caminho inexistente (403 sem s3:ListBucket) devolve a landing.
        CustomErrorResponses:
        - ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 10
        - ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 10

  WelcomeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WelcomeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowCloudFrontRead
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource: !Sub "${WelcomeBucket.Arn}/*"
          Condition:
            StringEquals:
              AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WelcomeDistribution}"

  # mystic-box-welcome.geskee.com.br -> CloudFront (alias, IPv4 e IPv6).
  # Z2FDTNDATAQYW2 e a hosted zone fixa de todas as distribuicoes do CloudFront.
  WelcomeDnsRecordIpv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WelcomeDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WelcomeDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WelcomeDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  DistributionId:
    Description: ID da distribuicao (usado para invalidar o cache no deploy)
    Value: !Ref WelcomeDistribution
  WelcomeUrl:
    Description: URL publica da landing page
    Value: !Sub "https://${DomainName}"
  CloudFrontUrl:
    Description: Endereco direto da distribuicao (antes de o DNS propagar)
    Value: !Sub "https://${WelcomeDistribution.DomainName}"
  BucketName:
    Description: Bucket com o build da landing page
    Value: !Ref WelcomeBucket
